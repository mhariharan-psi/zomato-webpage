<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zomato Clone</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="#">Zomato</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Delivery</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Dining Out</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Nightlife</a>
          </li>
        </ul>

        <!-- Step 1.5: Login & Sign up Buttons -->
        <div class="d-flex gap-2">
          <a href="#" class="btn btn-outline-light">Log in</a>
          <a href="#" class="btn btn-light text-danger fw-bold">Sign up</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero-section text-center text-white d-flex align-items-center">
    <div class="container">
      <h1 class="display-3 fw-bold">Zomato</h1>
      <p class="fs-5 mb-4">Discover the best food & drinks in your city</p>

      <!-- Step 2.3: Grid to center the search bar -->
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

          <!-- Step 2.5: Input Group combining location + search + button -->
          <div class="input-group input-group-lg">

            <!-- Step 2.4: Form Control - Location dropdown -->
            <select class="form-select" style="max-width: 150px;">
              <option selected>Chennai</option>
              <option>Mumbai</option>
              <option>Delhi NCR</option>
              <option>Bangalore</option>
              <option>Hyderabad</option>
            </select>

            <!-- Search input -->
            <input type="text" class="form-control"
                   placeholder="Search for restaurant, cuisine or a dish">

            <!-- Search button -->
            <button class="btn btn-light fw-bold text-danger" type="button">Search</button>
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
